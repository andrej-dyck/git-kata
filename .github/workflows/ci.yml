name: CI

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test-exercises:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Configure Git
      run: git config --global user.name "Git Kata" && git config --global user.email "git-kata@andrej-dyck"
    - name: Test Exercise 101
      run: bash ./scripts/_test-init.sh 101-local-amend-commit
    - name: Test Exercise 102
      run: bash ./scripts/_test-init.sh 102-local-commit-changes
    - name: Test Exercise 103
      run: bash ./scripts/_test-init.sh 103-local-undo-last-commits
    - name: Test Exercise 104
      run: bash ./scripts/_test-init.sh 104-local-rebase-onto-main
    - name: Test Exercise 105
      run: bash ./scripts/_test-init.sh 105-local-rebase-with-conflicts
    - name: Test Exercise 106
      run: bash ./scripts/_test-init.sh 106-local-interactive-rebase-reorder-commits
    - name: Test Exercise 107
      run: bash ./scripts/_test-init.sh 107-local-interactive-rebase-squash-commits
    - name: Test Exercise 108
      run: bash ./scripts/_test-init.sh 108-local-interactive-rebase-reword-commits
    - name: Test Exercise 109
      run: bash ./scripts/_test-init.sh 109-local-interactive-rebase-edit-commits
    - name: Test Exercise 110
      run: bash ./scripts/_test-init.sh 110-local-interactive-rebase-split-commits
    - name: Test Exercise 111
      run: bash ./scripts/_test-init.sh 111-local-interactive-rebase-delete-commits
    - name: Test Exercise 112
      run: bash ./scripts/_test-init.sh 112-local-interactive-rebase-onto-main
    - name: Test Exercise 113
      run: bash ./scripts/_test-init.sh 113-cherry-pick-commits
    - name: Test Exercise 201
      run: bash ./scripts/_test-init.sh 201-remote-amend-commit
    - name: Test Exercise 202
      run: bash ./scripts/_test-init.sh 202-remote-undo-last-commits
